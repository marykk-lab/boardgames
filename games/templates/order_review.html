<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-xl">
        <h1 class="text-3xl font-bold mb-6 text-center">🛒 Оформление заказа</h1>

        <p class="text-lg mb-4 text-center">Спасибо за покупку! Здесь будет информация о заказе.</p>

        <div class="border border-gray-700 rounded p-4 bg-gray-700 mb-4">
            <p class="mb-2">Товар: <span class="font-semibold">Название игры</span></p>
            <p class="mb-2">Количество: <span class="font-semibold">1</span></p>
            <p>Сумма: <span class="font-semibold">99 $</span></p>
        </div>

        <button class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded transition">
            Подтвердить заказ
        </button>
    </div>

</body>
</html>
